name: cle
channels:
  - conda-forge
dependencies:
  - python >=3.13
  - pip

  # required
  - numpy
  - scipy
  - spglib
  - pycifrw
  - pydantic >=2
  - qcelemental >=0.50
  - tqdm

  # tests
  - pytest

  # optional: LocalBackend, and InputFileBackend for programs other than Psi4
  - qcengine >=0.52
  - qcmanybody >=0.8

  # optional: FractalBackend
  - qcportal >=0.71

  # optional: a QC program, e.g. Psi4
  # - psi4
