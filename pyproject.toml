[build-system]
requires = ["setuptools>=61.0", "setuptools-git-versioning"]
build-backend = "setuptools.build_meta"

[project]
name = "crystalatte"
dynamic = ["version"]
dependencies = [
    "numpy",
    "pycifrw",
    "pydantic>=2",
    "qcelemental>=0.50",
    "scipy",
    "spglib",
    "tqdm",
]
requires-python = ">=3.13"
authors = [
    {name = "Jaden Yon", email = "jyon7@gatech.edu"},
    {name = "Carlos Borca", email = "carlosborca@gmail.com"},
]
description = "Automated calculation of crystal lattice energies with the many-body expansion"
readme = "README.md"
license = {file = "LICENSE"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
]

[project.optional-dependencies]
tests = [
    "pytest",
]
local = ["qcengine>=0.52.0", "qcmanybody>=0.8.0"]
fractal = ["qcportal>=0.71"]

[project.urls]
"Homepage" = "https://github.com/j-yon/CrystaLattE"
"Bug Tracker" = "https://github.com/j-yon/CrystaLattE/issues"

[tool.setuptools.packages]
find = {where = ["src"]}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
omit = ["*/tests/*"]

[tool.setuptools-git-versioning]
enabled = true
dev_template = "{tag}.post{ccount}+git.{sha}"
dirty_template = "{tag}.post{ccount}+git.{sha}.dirty"
